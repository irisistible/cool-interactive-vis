<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS316 - A4</title>

    <!-- CSS libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom CSS code -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Growth of the Three Different Species of Iris Flowers</h1>

    <div class="row">
        <div class="col-auto">
            <form class="row g-3">
                <div class="col-15" id="dimensions">
                    <div class="form-group">
                        <select class="form-control" id="sepal-dimension" style="font-family: Verdana, sans-serif">
                            <option value="sepal_width">Sepal width</option>
                            <option value="sepal_length">Sepal length</option>
                        </select>
                    </div>
                </div>
            </form>

            <form class="row g-3">
                <div class="col-15">
                    <div class="form-group">
                        <select class="form-control" id="petal-dimension" style="font-family: Verdana, sans-serif">
                            <option value="petal_width">Petal width</option>
                            <option value="petal_length">Petal length</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-auto">
            <div class="row" id="species-filter">
                <h6>Species shown:</h6>
                <div class="container" id="species-checkbox">
                    <input type="checkbox" id="setosa-check" name="setosa" value="setosa">
                    <label for="setosa-check" style="font-family: Verdana, sans-serif">Setosa</label>
                    <input type="checkbox" id="versicolor-check" name="versicolor" value="versicolor">
                    <label for="versicolor-check" style="font-family: Verdana, sans-serif">Versicolor</label>
                    <input type="checkbox" id="virginica-check" name="virginica" value="virginica">
                    <label for="virginica-check" style="font-family: Verdana, sans-serif">Virginica</label>
                </div>
            </div>
        </div>
    </div>
    


    <!-- Parent container for the visualization -->
    <div class="row justify-content-center" style="height: 60vh">
                <div class="align-self-center" id="chart-area" style="height: 100%; width: 100%"></div>
            </div>

</div>

<!-- Load JS libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<!-- d3 -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- Visualization objects -->
<script src="js/scatterplot.js"></script>

<!-- Load data, create visualizations -->
<script src="js/main.js"></script>
</body>
</html>
